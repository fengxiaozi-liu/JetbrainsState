name: Release validation

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    if: github.event.created && !github.event.deleted
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Check the tagged test commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $treeSha = gh api "repos/$env:GITHUB_REPOSITORY/git/commits/$env:GITHUB_SHA" --jq '.tree.sha'
          if ($LASTEXITCODE -ne 0 -or !$treeSha) { throw 'Could not resolve the tagged Git tree.' }

          $response = gh api "repos/$env:GITHUB_REPOSITORY/git/trees/${treeSha}?recursive=1"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the tagged Git tree.' }
          $tree = $response | ConvertFrom-Json
          $expectedPaths = @('.github/workflows/release.yml', '.gitignore')
          $files = @($tree.tree | Where-Object type -ne 'tree')
          $unexpected = @($files | Where-Object { $_.mode -ne '100644' -or $_.path -cnotin $expectedPaths })
          if ($tree.truncated -or $files.Count -ne $expectedPaths.Count -or $unexpected.Count -ne 0) {
              throw 'The test tag must point to a commit containing only the release workflow and .gitignore.'
          }

      - name: Build and verify the test ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $manifest = Join-Path $env:RUNNER_TEMP 'release-validation.json'
          [ordered]@{
              purpose = 'release-validation'
              tag = $env:GITHUB_REF_NAME
              commit = $env:GITHUB_SHA
          } | ConvertTo-Json | Set-Content -LiteralPath $manifest -Encoding utf8

          $zip = Join-Path (Get-Location).Path 'dist/release-validation.zip'
          Compress-Archive -LiteralPath $manifest -DestinationPath $zip
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
              if ($archive.Entries.Count -ne 1 -or $archive.Entries[0].FullName -cne 'release-validation.json') {
                  throw 'Unexpected file list in the test ZIP.'
              }
              $reader = [IO.StreamReader]::new($archive.Entries[0].Open())
              try {
                  if ($reader.ReadToEnd() -cne (Get-Content -LiteralPath $manifest -Raw)) {
                      throw 'The release validation manifest did not round-trip.'
                  }
              } finally {
                  $reader.Dispose()
              }
          } finally {
              $archive.Dispose()
          }

      - name: Publish the test GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create $env:GITHUB_REF_NAME 'dist/release-validation.zip' `
              --verify-tag --prerelease --title "Release validation $env:GITHUB_REF_NAME" `
              --notes 'Validates tagged release creation and upload of a ZIP containing only a JSON manifest.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
